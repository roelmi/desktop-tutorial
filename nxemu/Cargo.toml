[package]
name = "nxemu"
version = "0.1.0"
edition = "2021"
description = "Base educativa de un emulador de Nintendo Switch: CPU AArch64, memoria, cargador NRO y SVC mínimos"

[dependencies]

[lib]
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[profile.test]
opt-level = 3
