<!doctype html>
<html><head><meta charset="utf-8"><title>CardStream Overlay</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:system-ui,sans-serif}
body.preview{background:#222 url() }
#stack{position:fixed;top:24px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:12px;align-items:center;width:min(90vw,760px)}
.pop{background:rgba(15,18,28,.92);color:#fff;border:3px solid var(--c);border-radius:18px;padding:16px 24px;display:flex;gap:16px;align-items:center;box-shadow:0 8px 30px #0008;animation:in .35s ease-out;width:100%}
.pop .e{font-size:48px}.pop .who{font-size:14px;color:#aab3c7}.pop .n{font-size:26px;font-weight:800}.pop .t{font-size:20px}
.pop .bar{height:6px;background:var(--c);border-radius:3px;margin-top:8px;animation:drain var(--s) linear forwards}
.wanted{--c:#ff4747}
@keyframes in{from{transform:translateY(-30px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes drain{from{width:100%}to{width:0}}
.fall{position:fixed;top:-60px;font-size:36px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
</style></head><body>
<div id="stack"></div>
<script>
const stack=document.getElementById('stack');
const col={common:'#8d97ab',rare:'#3fa7ff',epic:'#b66bff',legendary:'#ffb53f'};
function rain(list,n){for(let i=0;i<n;i++){const s=document.createElement('div');s.className='fall';s.textContent=list[i%list.length];
 s.style.left=Math.random()*100+'vw';s.style.animationDuration=(2+Math.random()*2.5)+'s';s.style.animationDelay=Math.random()*0.8+'s';
 document.body.appendChild(s);setTimeout(()=>s.remove(),6000)}}
function pop(ev,secs){const c=ev.card,d=document.createElement('div');d.className='pop';d.style.setProperty('--c',col[c.rarity]);d.style.setProperty('--s',secs+'s');
 d.innerHTML=`<div class="e"></div><div><div class="who"></div><div class="n"></div><div class="t"></div><div class="bar"></div></div>`;
 d.querySelector('.e').textContent=c.emoji;d.querySelector('.who').textContent=`${ev.viewer} (${ev.platform}) played`;
 d.querySelector('.n').textContent=c.name;d.querySelector('.t').textContent=c.text;stack.appendChild(d);setTimeout(()=>d.remove(),secs*1000)}
function handle(ev){const c=ev.card;
 if(c.effect==='confetti'){rain(['🎉','🎊','✨'],40);pop(ev,5)}
 else if(c.effect==='emojirain'){rain(['🪙'],35);pop(ev,5)}
 else if(c.effect==='banner'){rain(['🚂','🔥'],20);pop(ev,6)}
 else if(c.effect==='challenge'){pop(ev,c.seconds||30)}
 else if(c.effect==='wanted'){const d=pop(ev,c.seconds||45);stack.lastChild?.classList.add('wanted');rain(['⭐'],25)}}
const es=new EventSource('/events');es.onmessage=e=>handle(JSON.parse(e.data));
if(location.search.includes('preview'))document.body.style.background='#1b2030';
</script></body></html>
